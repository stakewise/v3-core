name: Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  forge-tests:
    name: Forge Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.5.1

      - name: Run tests
        run: forge test --isolate --gas-snapshot-check=true -vvv
        env:
          TEST_USE_FORK_VAULTS: false
          TEST_SKIP_SNAPSHOTS: false
          MAINNET_RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
          GNOSIS_RPC_URL: ${{ secrets.GNOSIS_RPC_URL }}
          FOUNDRY_PROFILE: test
